services:
  discord-voice-relay-bot:
    build:
      context: .
    image: discord-voice-relay-bot:local
    container_name: discord-voice-relay-bot
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COMMAND_GUILD_IDS: ${COMMAND_GUILD_IDS:-}
    volumes:
      - ./.local:/app/.local
